version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: medspa_db
      POSTGRES_USER: medspa_user
      POSTGRES_PASSWORD: medspa_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medspa_user -d medspa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: medspa_db
      DB_USER: medspa_user
      DB_PASSWORD: medspa_password
      DB_HOST: db

volumes:
  postgres_data:
  